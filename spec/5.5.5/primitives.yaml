# GEDCOM 5.5.5 primitive elements used by grammar.yaml, transcribed from the specification:
# the enumerations, the elements with a grammar, and the size of text values. See README.md
# and NOTICE. The notation is that of spec/5.5.1/primitives.yaml, plus a map form:
#
#   ELEMENT: {size: 'min:max'}                 text of min to max characters
#   ELEMENT: {is: GRAMMAR, size: 'min:max'}    a grammar (or <OTHER>) and a size
#
# In 5.5.5 {Size=…} is "the minimum and maximum length of the logical line value". Sizes are
# kept for text and for the text-like NAME_PERSONAL and PLACE_NAME; dates, ages, times and
# version numbers are checked by their grammar alone, which some sizes contradict
# (TIME_VALUE {Size=7:12} against "hh:mm").

ADDRESS_CITY: {size: '1:60'}
ADDRESS_COUNTRY: {size: '1:60'}
ADDRESS_EMAIL: {size: '5:120'}
ADDRESS_FAX: {size: '5:60'}
ADDRESS_LINE1: {size: '1:60'}
