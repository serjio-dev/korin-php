name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.dependencies }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        dependencies: [lowest, highest]
        include:
          # Spec section 11: Windows and macOS on the oldest and newest supported PHP.
          - { os: windows-latest, php: '8.2', dependencies: highest }
          - { os: windows-latest, php: '8.6', dependencies: highest }
          - { os: macos-latest, php: '8.2', dependencies: highest }
          - { os: macos-latest, php: '8.6', dependencies: highest }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, zip
          coverage: none
          ini-values: error_reporting=E_ALL, zend.assertions=1
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      # The corpus's external cases (gedcom.io files without a license) are downloaded, not committed.
      - name: Fetch external corpus inputs
        shell: bash
        run: "$(command -v python3 || command -v python) vendor/korin/gedcom-corpus/scripts/fetch-external.py"
      - run: vendor/bin/phpunit

  without-intl:
    name: PHP 8.2 without intl and zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: :intl, :zip
          coverage: none
      - uses: ramsey/composer-install@v3
      # ANSEL falls back to bundled composition tables; the corpus fingerprint helper needs intl.
      # Without zip, GEDZIP throws GedzipException and its tests are skipped.
      - run: vendor/bin/phpunit --testsuite unit,conformance
